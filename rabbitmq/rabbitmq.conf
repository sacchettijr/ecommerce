# Config mínima para dev — broker do Celery (RABBITMQ_HOST/PORT no .env).
# Usuário/senha/vhost padrão (RABBITMQ_DEFAULT_USER/PASS/VHOST) não vão aqui:
# são lidos direto do .env pelo entrypoint da imagem oficial.

# Evita o broker parar de aceitar mensagens por pouca RAM livre — o padrão
# (40% da RAM total do host) é baixo demais numa máquina de dev qualquer.
vm_memory_high_watermark.relative = 0.6

# Idem para disco: o padrão de 50MB livres é fácil de bater em dev.
disk_free_limit.absolute = 100MB

# Reduz ruído no `docker compose logs rabbitmq` — só avisos e erros.
log.console.level = warning
