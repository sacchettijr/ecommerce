# Config mínima para dev — usado como broker de resultado do Celery (DB 0)
# e cache do Django (DB 1). Ver .env: REDIS_CELERY_DB / REDIS_CACHE_DB.

# Persiste em disco (volume `redis`) para não perder resultado de tarefa
# nem cache ao reiniciar o container.
appendonly yes
appendfsync everysec

# Evita a instância crescer sem limite num ambiente de dev.
maxmemory 256mb
maxmemory-policy allkeys-lru
