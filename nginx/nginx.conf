# WebSocket (HMR do Vite): só mandamos "Connection: upgrade" para o upstream quando a
# requisição original realmente pediu upgrade; caso contrário, o valor fica vazio e o
# Nginx usa o comportamento normal de keep-alive. Sem isso, toda requisição comum (sem
# cabeçalho Upgrade) seguia com "Connection: upgrade" mesmo assim.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name localhost;

    # DNS interno do Docker.
    # Permite que o Nginx atualize os IPs dos containers recriados.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 10M;

    # =========================================================
    # React + Vite
    # =========================================================

    location / {
        set $frontend_upstream frontend:5173;

        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário para o HMR do Vite
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # =========================================================
    # Django API
    # =========================================================

    location /api/ {
        set $django_upstream backend:8000;

        proxy_pass http://$django_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # Django Admin
    # =========================================================

    location /admin/ {
        set $django_upstream backend:8000;

        proxy_pass http://$django_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # Django Debug Toolbar
    # =========================================================

    location /__debug__/ {
        set $django_upstream backend:8000;

        proxy_pass http://$django_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # Django static
    # =========================================================

    location /static/ {
        alias /app/staticfiles/;
    }

    # =========================================================
    # Django media
    # =========================================================

    location /media/ {
        alias /app/mediafiles/;
    }
}
