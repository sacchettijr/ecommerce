map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# HTTP: permite validar e renovar o certificado.
# O restante das requisições é redirecionado para HTTPS.
server {
    listen 80;
    server_name 177.222.210.50 localhost;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;

    server_name 177.222.210.50 localhost;

    ssl_certificate
        /etc/letsencrypt/live/177.222.210.50/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/177.222.210.50/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 10M;

    # React + Vite
    location / {
        set $frontend_upstream frontend:5173;
        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket do HMR do Vite
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Django API
    location /api/ {
        set $django_upstream backend:8000;
        proxy_pass http://$django_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin
    location /admin/ {
        set $django_upstream backend:8000;
        proxy_pass http://$django_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Debug Toolbar
    location /__debug__/ {
        set $django_upstream backend:8000;
        proxy_pass http://$django_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos estáticos
    location /static/ {
        alias /app/staticfiles/;
    }

    # Arquivos de mídia
    location /media/ {
        alias /app/mediafiles/;
    }
}
