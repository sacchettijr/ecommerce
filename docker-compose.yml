services:
    #   BANCO DE DADOS
    database:
        container_name: ecommerce_postgres
        image: postgres:17-bookworm
        restart: unless-stopped
        volumes:
            - postgres:/var/lib/postgresql/data
        env_file:
            - .env
        ports:
            - "5432:5432"
        networks:
            - ecommerce_network
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5

    #   VISUALIZAÇÃO E MANIPULAÇÃO DO BANCO DE DADOS
    cloudbeaver:
        container_name: ecommerce_cloudbeaver
        image: dbeaver/cloudbeaver:26.2.0
        restart: unless-stopped
        volumes:
            - cloudbeaver:/opt/cloudbeaver/workspace
        ports:
            - "8978:8978"
        networks:
            - ecommerce_network
        depends_on:
            - database

    #   CACHE DO DJANGO + RESULT BACKEND DO CELERY
    redis:
        container_name: ecommerce_redis
        image: redis:8.10-alpine
        restart: unless-stopped
        command: redis-server /usr/local/etc/redis/redis.conf
        volumes:
            - redis:/data
            - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
        ports:
            - "6379:6379"
        networks:
            - ecommerce_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    #   BROKER DE MENSAGENS DO CELERY
    rabbitmq:
        container_name: ecommerce_rabbitmq
        image: rabbitmq:4.2.9-management-alpine
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - rabbitmq:/var/lib/rabbitmq
            - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
        ports:
            - "5672:5672"
            - "15672:15672"
        networks:
            - ecommerce_network
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
            interval: 10s
            timeout: 5s
            retries: 5

    #   WORKER DO CELERY (mesma imagem do django, comando diferente)
    celery:
        container_name: ecommerce_celery
        build:
            context: .
        restart: unless-stopped
        entrypoint: []
        command: celery -A PROJECT worker --loglevel=info
        working_dir: /app
        volumes:
            - .:/app
        env_file:
            - .env
        networks:
            - ecommerce_network
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy

    #   BACKEND
    backend:
        container_name: ecommerce_django
        build:
            context: .
        restart: unless-stopped
        working_dir: /app
        volumes:
            - .:/app
            - staticfiles:/app/staticfiles
            - media:/app/mediafiles
        env_file:
            - .env
        # "ports" (publicada no host) comentado de propósito: com o Nginx ativo, só ele
        # precisa ficar público. "expose" mantém a porta acessível para os outros
        # containers (Nginx, Celery) pela rede Docker. Para voltar a testar o Django
        # direto em http://localhost:8000 (sem Nginx), comente "expose" e descomente "ports".
        expose:
            - "8000"
        # ports:
        #     - "8000:8000"
        networks:
            - ecommerce_network
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/core/health/', timeout=3)",
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    #   FRONTEND (React + Vite)
    frontend:
        container_name: ecommerce_frontend
        build:
            context: ./frontend
        restart: unless-stopped
        working_dir: /app
        volumes:
            - ./frontend:/app
            - frontend_node_modules:/app/node_modules
        env_file:
            - .env
        # Mesmo raciocínio do backend: com o Nginx ativo, só ele fica público.
        expose:
            - "5173"
        # ports:
        #     - "5173:5173"
        command: npm run dev -- --host 0.0.0.0
        networks:
            - ecommerce_network
        depends_on:
            - backend
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    #   NGINX
    nginx:
        container_name: ecommerce_nginx
        image: nginx:1.29-alpine
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - staticfiles:/app/staticfiles:ro
            - media:/app/mediafiles:ro
        networks:
            - ecommerce_network
        depends_on:
            backend:
                condition: service_healthy
            frontend:
                condition: service_healthy

networks:
    ecommerce_network:
        driver: bridge

volumes:
    postgres:
        driver: local
    cloudbeaver:
        driver: local
    redis:
        driver: local
    rabbitmq:
        driver: local
    staticfiles:
        driver: local
    media:
        driver: local
    frontend_node_modules:
        driver: local
