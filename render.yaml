databases:
    - name: ecommerce-db
      plan: free
      databaseName: ecommerce
      user: ecommerce

services:
    - name: ecommerce-django
      type: web
      runtime: docker
      plan: free
      dockerfilePath: ./backend/Dockerfile
      dockerContext: ./backend
      healthCheckPath: /api/core/health/
      envVars:
          #   Fase de prototipação: DEBUG continua True nos dois ambientes (local e Render).
          #   Vai virar False quando o projeto entrar em produção de verdade.
          - key: DEBUG
            value: "True"
          - key: SECRET_KEY
            generateValue: true
          - key: DATABASE_URL
            fromDatabase:
                name: ecommerce-db
                property: connectionString
          - key: SITE_URL
            sync: false
          - key: FRONTEND_URL
            value: http://localhost:5173
          - key: SITE_NAME
            value: E-Commerce
          - key: LANGUAGE_CODE
            value: pt-br
          - key: TIME_ZONE
            value: America/Manaus
          - key: PAGE_SIZE
            value: "25"
          - key: PHONENUMBER_DEFAULT_REGION
            value: BR
          - key: EMAIL_HOST
            sync: false
          - key: EMAIL_PORT
            value: "587"
          - key: EMAIL_USE_TLS
            value: "True"
          - key: EMAIL_HOST_USER
            sync: false
          - key: EMAIL_HOST_PASSWORD
            sync: false
          - key: DEFAULT_FROM_EMAIL
            sync: false

    - name: ecommerce-frontend
      type: web
      runtime: static
      buildCommand: cd frontend && npm ci && npm run build
      staticPublishPath: ./frontend/dist
      routes:
          - type: rewrite
            source: /api/*
            destination: https://ecommerce-django.onrender.com/api/*
          - type: rewrite
            source: /admin/*
            destination: https://ecommerce-django.onrender.com/admin/*
          - type: rewrite
            source: /static/*
            destination: https://ecommerce-django.onrender.com/static/*
          - type: rewrite
            source: /media/*
            destination: https://ecommerce-django.onrender.com/media/*
          - type: rewrite
            source: /*
            destination: /index.html
