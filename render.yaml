databases:
    - name: ecommerce-db
      plan: free
      databaseName: ecommerce
      user: ecommerce

services:
    - name: ecommerce-redis
      type: keyvalue
      plan: free
      ipAllowList: []

    - name: ecommerce-django
      type: web
      runtime: docker
      plan: free
      dockerfilePath: ./Dockerfile
      dockerContext: .
      healthCheckPath: /api/core/health/
      envVars:
          - key: DEBUG
            value: "True"
          - key: SECRET_KEY
            generateValue: true
          - key: DATABASE_URL
            fromDatabase:
                name: ecommerce-db
                property: connectionString
          - key: REDIS_URL
            fromService:
                name: ecommerce-redis
                type: keyvalue
                property: connectionString
          - key: FRONTEND_URL
            sync: false
          - key: SITE_NAME
            value: E-Commerce
          - key: LANGUAGE_CODE
            value: pt-br
          - key: TIME_ZONE
            value: America/Manaus
          - key: PAGE_SIZE
            value: "25"
          - key: PHONENUMBER_DEFAULT_REGION
            value: BR
          - key: EMAIL_HOST
            sync: false
          - key: EMAIL_PORT
            value: "587"
          - key: EMAIL_USE_TLS
            value: "True"
          - key: EMAIL_HOST_USER
            sync: false
          - key: EMAIL_HOST_PASSWORD
            sync: false
          - key: DEFAULT_FROM_EMAIL
            sync: false

    - name: ecommerce-celery
      type: worker
      runtime: docker
      plan: starter
      dockerfilePath: ./Dockerfile
      dockerContext: .
      dockerCommand: celery -A PROJECT worker --loglevel=info --concurrency=2
      envVars:
          - key: DEBUG
            value: "True"
          - key: SECRET_KEY
            sync: false
          - key: DATABASE_URL
            fromDatabase:
                name: ecommerce-db
                property: connectionString
          - key: REDIS_URL
            fromService:
                name: ecommerce-redis
                type: keyvalue
                property: connectionString
          - key: FRONTEND_URL
            sync: false
          - key: SITE_NAME
            value: E-Commerce
          - key: LANGUAGE_CODE
            value: pt-br
          - key: TIME_ZONE
            value: America/Manaus
          - key: PAGE_SIZE
            value: "25"
          - key: PHONENUMBER_DEFAULT_REGION
            value: BR
          - key: EMAIL_HOST
            sync: false
          - key: EMAIL_PORT
            value: "587"
          - key: EMAIL_USE_TLS
            value: "True"
          - key: EMAIL_HOST_USER
            sync: false
          - key: EMAIL_HOST_PASSWORD
            sync: false
          - key: DEFAULT_FROM_EMAIL
            sync: false

    - name: ecommerce-frontend
      type: web
      runtime: static
      buildCommand: cd frontend && npm ci && npm run build
      staticPublishPath: ./frontend/dist
      routes:
          - type: rewrite
            source: /api/*
            destination: https://ecommerce-django-77ou.onrender.com/api/*
          - type: rewrite
            source: /admin/*
            destination: https://ecommerce-django-77ou.onrender.com/admin/*
          - type: rewrite
            source: /static/*
            destination: https://ecommerce-django-77ou.onrender.com/static/*
          - type: rewrite
            source: /media/*
            destination: https://ecommerce-django-77ou.onrender.com/media/*
          - type: rewrite
            source: /*
            destination: /index.html
