{
    "folders": {},
    "connections": {
        "ecommerce-postgres": {
            "provider": "postgresql",
            "driver": "postgres-jdbc",
            "name": "E-commerce Postgres",
            "save-password": true,
            "read-only": false,
            "configuration": {
                "host": "database",
                "port": "5432",
                "database": "ecommerce",
                "url": "jdbc:postgresql://database:5432/ecommerce",
                "configurationType": "MANUAL",
                "auth-model": "native",
                "auth-properties": {
                    "userName": "postgres"
                }
            }
        }
    }
}
